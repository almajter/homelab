- name: Prepare nodes for kubeadm
  hosts: all
  become: true
  tasks:
    - name: Install qemu-guest-agent
      ansible.builtin.apt:
        name: qemu-guest-agent

    - name: Enable IPv4 packet forwarding
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_file: /etc/sysctl.d/k8s.conf

    - name: Add the Docker apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: stable
        architectures: amd64
        signed_by: https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg

    - name: Install containerd
      ansible.builtin.apt:
        name: containerd.io
        update_cache: true

    - name: Configure containerd for Kubernetes
      ansible.builtin.copy:
        dest: /etc/containerd/config.toml
        content: |
          version = 4
          imports = ["/etc/containerd/conf.d/*.toml"]

          [plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.runc.options]
            SystemdCgroup = true
        mode: "0644"
      notify: Restart containerd

    - name: Add the Kubernetes apt repository
      ansible.builtin.deb822_repository:
        name: kubernetes
        types: deb
        uris: https://pkgs.k8s.io/core:/stable:/v1.37/deb/
        suites: /
        signed_by: https://pkgs.k8s.io/core:/stable:/v1.37/deb/Release.key

    - name: Install kubelet, kubeadm and kubectl
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        update_cache: true

    - name: Hold Kubernetes packages
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

  handlers:
    - name: Restart containerd
      ansible.builtin.systemd_service:
        name: containerd
        state: restarted

- name: Prepare the media disk
  hosts: gpu
  become: true
  tasks:
    - name: Create the filesystem
      community.general.filesystem:
        dev: /dev/vdb
        fstype: ext4
        opts: -L media

    - name: Mount it
      ansible.posix.mount:
        path: /srv/media
        src: LABEL=media
        fstype: ext4
        opts: defaults
        state: mounted

