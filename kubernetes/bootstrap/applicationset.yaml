apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - git:
        repoURL: https://github.com/almajter/homelab.git
        revision: main
        files:
          - path: kubernetes/apps/*/config.yaml
  template:
    metadata:
      name: "{{ .path.basename }}"
    spec:
      project: default
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
  templatePatch: |
    spec:
      sources:
      {{- if .chart }}
        - repoURL: https://github.com/almajter/homelab.git
          targetRevision: main
          ref: values
        - repoURL: "{{ .chart.repoURL }}"
          chart: "{{ .chart.name }}"
          targetRevision: "{{ .chart.version }}"
          helm:
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/kubernetes/apps/{{ .path.basename }}/values.yaml
      {{- else }}
        - repoURL: https://github.com/almajter/homelab.git
          targetRevision: main
          path: "{{ .path.path }}"
      {{- end }}
