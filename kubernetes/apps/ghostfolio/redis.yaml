apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghostfolio-redis
  labels:
    app: ghostfolio-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ghostfolio-redis
  template:
    metadata:
      labels:
        app: ghostfolio-redis
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 1000
      containers:
        - name: redis
          image: redis:8.10.3-alpine
          args:
            - --requirepass
            - $(REDIS_PASSWORD)
            - --save
            - ""
            - --appendonly
            - "no"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ghostfolio
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ghostfolio-redis
  labels:
    app: ghostfolio-redis
spec:
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    app: ghostfolio-redis
