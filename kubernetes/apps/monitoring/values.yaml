kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false
prometheus:
  prometheusSpec:
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1536Mi
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
alertmanager:
  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: smtp-relay.brevo.com:587
      smtp_from: Alertmanager <alertmanager@alters.si>
      smtp_auth_username: b6719a001@smtp-brevo.com
      smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/password
    route:
      group_by: ["namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: "null"
      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
        - receiver: email
          matchers:
            - severity =~ "critical|warning"
    receivers:
      - name: "null"
      - name: email
        email_configs:
          - to: '{{ template "email.to" . }}'
            send_resolved: true
    templates:
      - /etc/alertmanager/config/*.tmpl
      - /etc/alertmanager/secrets/alertmanager-smtp/*.tmpl
  alertmanagerSpec:
    secrets:
      - alertmanager-smtp
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
grafana:
  defaultDashboardsTimezone: browser
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: grafana-com
          orgId: 1
          folder: grafana.com
          type: file
          disableDeletion: true
          editable: false
          options:
            path: /var/lib/grafana/dashboards/grafana-com
  dashboards:
    grafana-com:
      traefik:
        gnetId: 17347
        revision: 9
        datasource: Prometheus
      cloudnativepg:
        gnetId: 20417
        revision: 4
        datasource: Prometheus
  admin:
    existingSecret: grafana-admin
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.alters.si
