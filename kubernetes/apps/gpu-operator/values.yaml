extraObjects:
  - apiVersion: apps/v1
    kind: DaemonSet
    metadata:
      name: gpu-power-limit
    spec:
      selector:
        matchLabels:
          app: gpu-power-limit
      template:
        metadata:
          labels:
            app: gpu-power-limit
        spec:
          nodeSelector:
            nvidia.com/gpu.present: "true"
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
          containers:
            - name: power-limit
              image: nvcr.io/nvidia/driver:595.91.07-ubuntu24.04
              command: ["/bin/sh", "-c"]
              args:
                - |
                  while true; do
                    if limit=$(chroot /run/nvidia/driver nvidia-smi --query-gpu=power.limit --format=csv,noheader,nounits) \
                      && [ "$limit" != "250.00" ]; then
                      echo "power limit $limit W, setting 250 W"
                      chroot /run/nvidia/driver nvidia-smi -pm 1
                      chroot /run/nvidia/driver nvidia-smi -pl 250
                      chroot /run/nvidia/driver nvidia-smi -lgc 0,1395
                    fi
                    sleep 10
                  done
              securityContext:
                privileged: true
              volumeMounts:
                - name: driver
                  mountPath: /run/nvidia/driver
                  mountPropagation: HostToContainer
          volumes:
            - name: driver
              hostPath:
                path: /run/nvidia/driver
