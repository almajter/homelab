service:
  annotations:
    metallb.io/loadBalancerIPs: 10.0.10.30
  spec:
    externalTrafficPolicy: Local
ports:
  web:
    forwardedHeaders:
      trustedIPs:
        - 10.0.10.14/32
deployment:
  replicas: 2
podDisruptionBudget:
  enabled: true
  minAvailable: 1
topologySpreadConstraints:
  - labelSelector:
      matchLabels:
        app.kubernetes.io/name: '{{ template "traefik.name" . }}'
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    nodeTaintsPolicy: Honor

