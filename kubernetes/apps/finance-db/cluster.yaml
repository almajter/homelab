apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: finance-db
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-minimal-trixie
  storage:
    size: 5Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  managed:
    roles:
      - name: firefly
        login: true
        passwordSecret:
          name: finance-db-firefly
      - name: ghostfolio
        login: true
        passwordSecret:
          name: finance-db-ghostfolio
